AWSTemplateFormatVersion: "2010-09-09"
Description: Prepped GitHub Actions OIDC and CloudFormation execution roles

Parameters:
  GitHubOwner:
    Type: String
    Default: postmelee
  GitHubOwnerId:
    Type: String
    Default: "65849802"
  GitHubRepository:
    Type: String
    Default: Prepped
  GitHubRepositoryId:
    Type: String
    Default: "1335618877"
  GitHubEnvironment:
    Type: String
    Default: production
  ArtifactBucketName:
    Type: String
    Default: prepped-prod-sam-artifacts-845081398362
Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      Tags:
        - Key: Project
          Value: Prepped

  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: PreppedCloudFormationExecution
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PreppedProductionStackExecution
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ManagePreppedDynamoDbTable
                Effect: Allow
                Action:
                  - dynamodb:CreateTable
                  - dynamodb:DeleteTable
                  - dynamodb:DescribeTable
                  - dynamodb:DescribeTimeToLive
                  - dynamodb:TagResource
                  - dynamodb:UntagResource
                  - dynamodb:UpdateTable
                  - dynamodb:UpdateTimeToLive
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/prepped-*-order-api
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/prepped-*-catalog
              - Sid: ManagePreppedLambdaFunctions
                Effect: Allow
                Action:
                  - lambda:AddPermission
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:RemovePermission
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:prepped-*-order-api-*
              - Sid: ManagePreppedLogGroups
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:ListTagsForResource
                  - logs:PutRetentionPolicy
                  - logs:TagResource
                  - logs:UntagResource
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/prepped-*-order-api-*
              - Sid: DescribeLogGroupsForStackProgress
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: "*"
              - Sid: ManagePreppedLambdaRole
                Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:DetachRolePolicy
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:PassRole
                  - iam:PutRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                Resource:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/prepped-*-order-api-lambda
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/prepped-*-catalog-api-lambda
              - Sid: CreatePreppedLambdaRole
                Effect: Allow
                Action: iam:CreateRole
                Resource:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/prepped-*-order-api-lambda
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/prepped-*-catalog-api-lambda
              - Sid: ManagePreppedHttpApi
                Effect: Allow
                Action:
                  - apigateway:DELETE
                  - apigateway:GET
                  - apigateway:PATCH
                  - apigateway:POST
                  - apigateway:TagResource
                  - apigateway:UntagResource
                  - apigateway:PUT
                Resource:
                  - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis
                  - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis/*
                  - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/tags/*
              - Sid: UseServerlessTransform
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31
              - Sid: ReadDeploymentArtifacts
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${ArtifactBucketName}
                  - !Sub arn:${AWS::Partition}:s3:::${ArtifactBucketName}/*
      Tags:
        - Key: Project
          Value: Prepped
        - Key: Purpose
          Value: CloudFormationExecution

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: PreppedGitHubDeployProduction
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubOwner}/${GitHubRepository}:environment:${GitHubEnvironment}
                  - !Sub repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepository}@${GitHubRepositoryId}:environment:${GitHubEnvironment}
      Policies:
        - PolicyName: DeployPreppedProductionStack
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CreateOrUpdateOnlyPreppedProductionStack
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/prepped-prod-order-api/*
                Condition:
                  StringEquals:
                    cloudformation:RoleArn: !GetAtt CloudFormationExecutionRole.Arn
              - Sid: InspectOrExecuteOnlyPreppedProductionStack
                Effect: Allow
                Action:
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStacks
                  - cloudformation:ExecuteChangeSet
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/prepped-prod-order-api/*
              - Sid: ReadTemplateSummary
                Effect: Allow
                Action: cloudformation:GetTemplateSummary
                Resource: "*"
              - Sid: UploadDeploymentArtifacts
                Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:GetBucketLocation
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:PutObject
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${ArtifactBucketName}
                  - !Sub arn:${AWS::Partition}:s3:::${ArtifactBucketName}/*
              - Sid: PassOnlyPreppedExecutionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationExecutionRole.Arn
      Tags:
        - Key: Project
          Value: Prepped
        - Key: Purpose
          Value: GitHubOidcDeploy

Outputs:
  GitHubDeployRoleArn:
    Value: !GetAtt GitHubDeployRole.Arn
  CloudFormationExecutionRoleArn:
    Value: !GetAtt CloudFormationExecutionRole.Arn
  GitHubOidcProviderArn:
    Value: !Ref GitHubOidcProvider
